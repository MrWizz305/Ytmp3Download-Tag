# Generated for `fly launch` / `fly deploy`. Change `app` to whatever name
# `fly launch` assigns (it must be globally unique on Fly.io).
app = "youtube-mp3-backend"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
